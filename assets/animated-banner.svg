<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1118"/>
      <stop offset="1" stop-color="#101722"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#8AA0B8" stroke-opacity=".035"/>
    </pattern>
    <filter id="softGlow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>

  <!-- Left -->
  <text x="90" y="68" fill="#59D98E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">anas@github:~$ whoami</text>
  <rect x="301" y="52" width="8" height="17" rx="1" fill="#59D98E">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.46;.47;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <text x="90" y="148" fill="#F3F4F6" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="58" font-weight="800">Anas S. Muhammed</text>
  <text x="90" y="195" fill="#AAB4C2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">Data Analyst • Data Engineer • Applied ML</text>

  <text x="90" y="238" fill="#59D98E" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">→ currently building</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
    <text x="90" y="279" fill="#F3F4F6" opacity="1">smart-traffic-analytics<tspan fill="#59D98E">_</tspan>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.23;.27;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="279" fill="#F3F4F6" opacity="0">etl-pipeline<tspan fill="#59D98E">_</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.23;.27;.48;.52;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="279" fill="#F3F4F6" opacity="0">movie-recommender<tspan fill="#59D98E">_</tspan>
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.48;.52;.73;.77;1" dur="16s" repeatCount="indefinite"/>
    </text>
    <text x="90" y="279" fill="#F3F4F6" opacity="0">ecommerce-analytics<tspan fill="#59D98E">_</tspan>
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;.73;.77;1" dur="16s" repeatCount="indefinite"/>
    </text>
  </g>

  <rect x="90" y="304" width="470" height="2" rx="1" fill="#26313E"/>
  <rect x="90" y="304" width="0" height="2" rx="1" fill="#59D98E">
    <animate attributeName="width" values="0;470;470" keyTimes="0;.65;1" dur="5.2s" repeatCount="indefinite"/>
  </rect>

  <text x="90" y="329" fill="#6F7C8C" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    python • sql • data • machine learning • visualization
  </text>

  <!-- Right code card -->
  <g transform="translate(720 56)">
    <rect width="390" height="222" rx="16" fill="#0B1118" stroke="#2A3440"/>
    <rect width="390" height="38" rx="16" fill="#111923"/>

    <circle cx="20" cy="19" r="5" fill="#F25F5C"/>
    <circle cx="40" cy="19" r="5" fill="#F5C04A"/>
    <circle cx="60" cy="19" r="5" fill="#3ECF6A"/>

    <g transform="translate(0 38)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <g fill="#526173">
        <text x="18" y="34">1</text>
        <text x="18" y="66">2</text>
        <text x="18" y="98">3</text>
        <text x="18" y="130">4</text>
        <text x="18" y="162">5</text>
        <text x="18" y="194">6</text>
      </g>

      <rect x="42" y="16" width="320" height="24" rx="6" fill="#121D2A" opacity=".7">
        <animate attributeName="y" values="16;48;80;112;144;176;16" dur="11s" repeatCount="indefinite"/>
      </rect>

      <text x="56" y="34">
        <tspan fill="#F07A7A">import</tspan>
        <tspan fill="#E5E7EB"> pandas </tspan>
        <tspan fill="#F07A7A">as</tspan>
        <tspan fill="#8CC8FF"> pd</tspan>
      </text>
      <text x="56" y="66" fill="#E5E7EB">df = pd.read_csv(<tspan fill="#E9B85D">"traffic.csv"</tspan>)</text>
      <text x="56" y="98" fill="#7E8A99"># analyze traffic patterns</text>
      <text x="56" y="130" fill="#E5E7EB">traffic = (</text>
      <text x="82" y="162" fill="#E5E7EB">df.groupby(<tspan fill="#E9B85D">"hour"</tspan>)[<tspan fill="#E9B85D">"vehicle_count"</tspan>]</text>
      <text x="82" y="194" fill="#E5E7EB">.mean().reset_index())</text>
    </g>
  </g>

  <circle cx="1060" cy="70" r="2" fill="#59D98E" filter="url(#softGlow)">
    <animate attributeName="opacity" values=".25;1;.25" dur="3.2s" repeatCount="indefinite"/>
  </circle>
</svg>