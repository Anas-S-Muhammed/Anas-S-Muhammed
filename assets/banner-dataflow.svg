      <stop stop-color="#07111E"/>
      <stop offset="0.48" stop-color="#0B1731"/>
      <stop offset="1" stop-color="#1B1034"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="30" x2="1110" y2="310" gradientUnits="userSpaceOnUse">
